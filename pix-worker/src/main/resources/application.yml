server:
  port: 8081

spring:
  application:
    name: pix-worker
  datasource:
    url: jdbc:postgresql://localhost:5432/pix
    username: pix
    password: pix
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  rabbitmq:
    host: localhost
    port: 5672
    username: pix
    password: pix
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        observation-enabled: true
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
    logging:
      endpoint: http://localhost:4318/v1/logs

app:
  partner:
    latency-ms: 2000
    failure-rate: 0.2
    max-attempts: 3
  messaging:
    ttl-ms: 30000

resilience4j:
  circuitbreaker:
    instances:
      partnerPix:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-},%X{transactionId:-}]"
