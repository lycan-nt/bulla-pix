name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Testes e build Maven
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Rodar testes e empacotar módulos
        run: mvn -B clean verify

  docker-build:
    name: Build das imagens Docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test-and-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build imagem pix-api
        run: docker build -f pix-api/Dockerfile -t pix-api:ci .

      - name: Build imagem pix-worker
        run: docker build -f pix-worker/Dockerfile -t pix-worker:ci .
